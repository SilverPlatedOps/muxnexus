<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>muxnexus</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./app.ts"></script>
</head>
<body>
  <div id="layout">
    <div id="overlay" hidden></div>

    <!-- Lives outside #sidebar so a collapsed sidebar still has a way back in.
         Hidden by default; shown only when the layout is collapsed (desktop). -->
    <button id="expand" class="icon-btn" type="button" aria-label="Show sidebar (Command B)" title="Show sidebar &#8984;B">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"></rect>
        <line x1="10" y1="2.5" x2="10" y2="13.5"></line>
      </svg>
    </button>

    <aside id="sidebar" aria-label="tmux sessions">
      <div id="sidebar-grip" class="grip" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
      <header id="brand">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#61afef" stroke-width="1.3" aria-hidden="true">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"></rect>
          <line x1="9" y1="2.5" x2="9" y2="13.5"></line>
          <line x1="9" y1="8" x2="14.5" y2="8"></line>
        </svg>
        <span class="word">muxnexus</span>
        <span class="spacer"></span>
        <button id="global-search-open" class="icon-btn" type="button" aria-label="Search everything (Command Shift K)" title="Search everything &#8984;&#8679;K">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3 3"></path></svg>
        </button>
        <button id="display" class="icon-btn" type="button" aria-label="Display and about" title="Display and about">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
            <line x1="2.5" y1="4.5" x2="13.5" y2="4.5"></line>
            <line x1="2.5" y1="11.5" x2="13.5" y2="11.5"></line>
            <circle cx="10" cy="4.5" r="1.7" fill="var(--chrome)"></circle>
            <circle cx="6" cy="11.5" r="1.7" fill="var(--chrome)"></circle>
          </svg>
        </button>
        <button id="collapse" class="icon-btn" type="button" aria-label="Hide sidebar (Command B)" title="Hide sidebar &#8984;B">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"></rect>
            <line x1="6" y1="2.5" x2="6" y2="13.5"></line>
          </svg>
        </button>
        <button id="drawer-close" class="icon-btn close" type="button" aria-label="Close sessions">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="4" x2="12" y2="12"></line>
            <line x1="12" y1="4" x2="4" y2="12"></line>
          </svg>
        </button>
      </header>

      <!-- Chats beside Workspaces: one list at a time, quota under both. -->
      <div id="side-tabs" role="tablist" aria-label="Sidebar">
        <button id="side-tab-chats" class="side-tab" type="button" role="tab" title="Chats (&#8984;1)">Chats<span id="side-tab-dot" class="tab-dot" hidden></span></button>
        <button id="side-tab-workspaces" class="side-tab" type="button" role="tab" title="Workspaces (&#8984;2)">Workspaces</button>
      </div>

      <div id="side-search">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.6"></circle><line x1="10.4" y1="10.4" x2="13.5" y2="13.5"></line></svg>
        <input id="side-search-input" type="search" placeholder="Sessions and windows" aria-label="Search sessions and windows" autocomplete="off" spellcheck="false" />
        <kbd>&#8984;K</kbd>
      </div>
      <!-- Outside #sessions, which is rebuilt on every render. -->
      <button id="next-waiting" type="button" title="Go to the next session waiting on you, else the next with news (&#8984;J)" disabled>
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 3v10l8-5z"></path></svg>
        <span class="next-label">Next waiting</span>
        <span id="next-count" hidden></span>
        <kbd>&#8984;J</kbd>
      </button>
      <div id="sessions"></div>
      <div id="chats" hidden></div>
      <!-- A sibling of the footer, not a child: the footer is rebuilt on every
           session render and would take the panel with it. -->
      <div id="usage" aria-label="Quota"></div>
      <footer id="side-foot"></footer>
    </aside>

    <main id="main">
      <header id="topbar" hidden>
        <div id="crumb">
          <button id="hamburger" class="icon-btn" type="button" aria-label="Show sessions">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
              <line x1="2.5" y1="4" x2="13.5" y2="4"></line>
              <line x1="2.5" y1="8" x2="13.5" y2="8"></line>
              <line x1="2.5" y1="12" x2="13.5" y2="12"></line>
            </svg>
          </button>
          <span class="chip"><span id="chip-dot" class="glyph none"></span><span id="chip-name"></span></span>
          <button id="chat-back" class="btn chat-back" type="button" hidden></button>
        </div>
        <button id="view-toggle" class="icon-btn" type="button" aria-label="Switch between the terminal and the view" aria-pressed="false" title="Terminal / view" hidden>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <rect x="2" y="2" width="5" height="5" rx="1"></rect>
            <rect x="9" y="2" width="5" height="5" rx="1"></rect>
            <rect x="2" y="9" width="5" height="5" rx="1"></rect>
            <rect x="9" y="9" width="5" height="5" rx="1"></rect>
          </svg>
        </button>
        <button id="note-btn" class="icon-btn" type="button" aria-label="Note" aria-pressed="false" title="Note (⌘⇧E)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 2.5h7l3 3v8H3z"></path>
            <line x1="5.5" y1="7" x2="10.5" y2="7"></line>
            <line x1="5.5" y1="9.5" x2="10.5" y2="9.5"></line>
            <line x1="5.5" y1="12" x2="8.5" y2="12"></line>
          </svg>
        </button>
        <span id="conn" title="Connected"></span>
      </header>

      <div id="status" hidden>
        <span class="dot on" style="background: #e5c07b; border-color: #e5c07b;"></span>
        <span id="status-text">Reconnecting</span>
        <span class="spacer"></span>
        <button id="retry" class="btn" type="button">Retry</button>
      </div>

      <div id="empty">
        <span>Pick a session, or</span>
        <button id="empty-new" class="btn" type="button">New session</button>
      </div>

      <!-- An alternative view of every agent, in place of the terminal; the
           terminal stays attached underneath. -->
      <div id="view" hidden></div>

      <!-- A group chat: the conversation, with a member's terminal beside it on request. -->
      <div id="chat" hidden></div>

      <div id="wrap" hidden>
        <div id="tabs" hidden></div>
        <div id="term-shell">
          <div id="pane-main" class="pane">
            <div class="pane-body"><div id="terminal"></div></div>
          </div>
          <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize the two sides"
               aria-valuemin="20" aria-valuemax="80" tabindex="0" hidden></div>
          <div id="pane-side" class="pane" hidden>
            <div class="pane-body"><div id="terminal-side"></div></div>
          </div>
          <div id="find" hidden>
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#909aa7" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
              <circle cx="7" cy="7" r="4.6"></circle>
              <line x1="10.4" y1="10.4" x2="13.5" y2="13.5"></line>
            </svg>
            <label for="find-input" class="sr-only">Find in scrollback</label>
            <input id="find-input" type="text" autocomplete="off" spellcheck="false" />
            <span id="find-count"></span>
            <button id="find-prev" class="row-btn" type="button" aria-label="Previous match">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><polyline points="4,10 8,6 12,10"></polyline></svg>
            </button>
            <button id="find-next" class="row-btn" type="button" aria-label="Next match">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><polyline points="4,6 8,10 12,6"></polyline></svg>
            </button>
            <button id="find-close" class="row-btn" type="button" aria-label="Close search">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12"></line><line x1="12" y1="4" x2="4" y2="12"></line></svg>
            </button>
          </div>
      </div>
    </main>

    <aside id="notes-panel" aria-label="Notes" hidden>
      <div id="notes-grip" class="grip" role="separator" aria-orientation="vertical" aria-label="Resize notes" tabindex="0"></div>
      <header id="notes-head">
        <div class="notes-tabs" role="tablist">
          <button id="notes-tab-window" class="notes-tab" type="button" role="tab" title="This window's note (&#8984;&#8679;E)">This window</button>
          <button id="notes-tab-all" class="notes-tab" type="button" role="tab" title="Search every note (&#8984;&#8679;F)">All notes</button>
        </div>
        <span class="spacer"></span>
        <button id="notes-close" class="icon-btn" type="button" aria-label="Close notes" title="Close notes">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12"></line><line x1="12" y1="4" x2="4" y2="12"></line></svg>
        </button>
      </header>
      <section id="notes-window" class="notes-body" role="tabpanel">
        <div id="note-heading" class="note-heading"></div>
        <div id="note-text"></div>
      </section>
      <section id="notes-all" class="notes-body" role="tabpanel" hidden></section>
      <section id="system" aria-label="System overview" hidden>
        <div id="system-grip" class="grip-row" role="separator" aria-orientation="horizontal" aria-label="Resize the system overview" tabindex="0"></div>
        <header class="sys-head">
          <button id="system-toggle" class="sys-toggle" type="button" aria-expanded="false">
            <span class="chevron"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></span>
            <span class="sys-title sys-toggle-title">System</span>
            <span id="system-summary" class="sys-summary"></span>
          </button>
          <span class="sys-tabs" role="tablist" aria-label="Overview">
            <button id="system-tab-system" class="sys-title sys-tab" type="button" role="tab">System</button>
            <button id="system-tab-docker" class="sys-title sys-tab" type="button" role="tab">Docker</button>
          </span>
          <span class="spacer"></span>
          <button id="system-close" class="icon-btn" type="button" aria-label="Close system overview" title="Close system overview (Display brings it back)">
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="4" x2="12" y2="12"></line><line x1="12" y1="4" x2="4" y2="12"></line></svg>
          </button>
        </header>
        <div id="system-body" role="tabpanel"></div>
        <div id="docker-body" role="tabpanel" hidden></div>
      </section>
    </aside>
  </div>
</body>
</html>
